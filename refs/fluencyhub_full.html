<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>FluencyHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── DESIGN TOKENS ── */
:root {
  --font-heading: 'Albert Sans', sans-serif;
  --font-body: 'Cabin', sans-serif;
  /* Brand */
  --brand: #1a56db;
  --brand-50: #eff6ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-500: #3b82f6;
  --brand-600: #1a56db;
  --brand-700: #1e40af;
  --brand-900: #1e3a5f;
  /* Accent */
  --accent: #f59e0b;
  --accent-50: #fffbeb;
  --accent-100: #fef3c7;
  --accent-500: #f59e0b;
  --accent-600: #d97706;
  /* Neutral */
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  --border: #e4e4e7;
  --border-2: #d4d4d8;
  --text: #09090b;
  --text-2: #3f3f46;
  --text-3: #71717a;
  --text-4: #a1a1aa;
  /* Status */
  --green: #16a34a; --green-bg: #f0fdf4; --green-border: #bbf7d0;
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --yellow: #ca8a04; --yellow-bg: #fefce8; --yellow-border: #fef08a;
  --blue: #1d4ed8; --blue-bg: #eff6ff; --blue-border: #bfdbfe;
  /* Sidebar */
  --sidebar: #09090b;
  --sidebar-text: #a1a1aa;
  --sidebar-hover: #18181b;
  --sidebar-active-user: #1a56db;
  --sidebar-active-inst: #059669;
  --sidebar-active-admin: #dc2626;
  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,.1), 0 8px 10px rgba(0,0,0,.04);
  /* Radius */
  --r-sm: 6px; --r: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 24px;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; font-size: 14px; line-height: 1.5; }
button { cursor: pointer; border: none; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; background: none; }
input, textarea, select { font-family: var(--font-body); outline: none; -webkit-appearance: none; }
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
h1,h2,h3,h4,h5,h6 { font-family: var(--font-heading); font-weight: 700; line-height: 1.2; color: var(--text); }

/* ── TYPOGRAPHY ── */
.heading-xl { font-size: clamp(32px, 5vw, 56px); font-weight: 800; font-family: var(--font-heading); line-height: 1.08; letter-spacing: -0.02em; }
.heading-lg { font-size: clamp(24px, 3.5vw, 40px); font-weight: 800; font-family: var(--font-heading); letter-spacing: -0.02em; }
.heading-md { font-size: clamp(18px, 2.5vw, 26px); font-weight: 700; font-family: var(--font-heading); letter-spacing: -0.01em; }
.label-sm { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

/* ── SHADCN-STYLE UI PRIMITIVES ── */
/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; }
.card-sm { padding: 14px; }
.card-hover { transition: box-shadow .15s, border-color .15s; }
.card-hover:hover { box-shadow: var(--shadow-md); border-color: var(--border-2); }

/* Badge */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.badge-default { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.badge-primary { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-border); }
.badge-success { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.badge-warning { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
.badge-danger { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.badge-brand { background: var(--brand-50); color: var(--brand-600); border-color: var(--brand-200); }

/* Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r); font-weight: 600; font-size: 14px; font-family: var(--font-body); cursor: pointer; transition: all .15s; border: 1px solid transparent; white-space: nowrap; }
.btn-default { padding: 8px 16px; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--r-sm); }
.btn-lg { padding: 12px 24px; font-size: 15px; border-radius: var(--r-md); }
.btn-xl { padding: 14px 32px; font-size: 16px; border-radius: var(--r-md); }
.btn-full { width: 100%; }
.btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 1px 2px rgba(26,86,219,.3); }
.btn-primary:hover { background: var(--brand-700); }
.btn-primary:active { transform: scale(.98); }
.btn-secondary { background: var(--surface); color: var(--text-2); border-color: var(--border); box-shadow: var(--shadow-sm); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-destructive { background: var(--red); color: #fff; border-color: var(--red); }
.btn-destructive:hover { background: #b91c1c; }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-success:hover { background: #15803d; }
.btn-outline-primary { background: transparent; color: var(--brand); border-color: var(--brand-200); }
.btn-outline-primary:hover { background: var(--brand-50); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent-600); box-shadow: 0 1px 2px rgba(245,158,11,.3); }
.btn-accent:hover { background: var(--accent-600); }

/* Input */
.input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r); font-size: 14px; font-family: var(--font-body); background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,86,219,.12); outline: none; }
.input::placeholder { color: var(--text-4); }
.label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; font-family: var(--font-body); }

/* Progress */
.progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--brand-500), var(--brand)); border-radius: 999px; transition: width .4s ease; }

/* Separator */
.sep { height: 1px; background: var(--border); margin: 0; }

/* Scroll */
.scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.scroll-y::-webkit-scrollbar { width: 4px; }
.scroll-y::-webkit-scrollbar-track { background: transparent; }
.scroll-y::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
.noscroll { overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; }
.noscroll::-webkit-scrollbar { display: none; }

/* Table */
.tbl-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 520px; }
.tbl thead { background: var(--surface-2); }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; font-family: var(--font-body); }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover td { background: var(--surface-2); }

/* Toggle */
.toggle { width: 40px; height: 22px; border-radius: 11px; position: relative; cursor: pointer; border: none; flex-shrink: 0; transition: background .2s; }
.toggle-knob { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }

/* ── LAYOUT ── */
.dash-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
.sidebar { width: 248px; background: var(--sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-top { height: 60px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
.sidebar-profile { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.sidebar-nav { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--r); font-size: 13px; font-weight: 500; font-family: var(--font-body); color: var(--sidebar-text); transition: all .12s; cursor: pointer; border: none; width: 100%; text-align: left; background: transparent; }
.sidebar-item:hover { background: var(--sidebar-hover); color: #fff; }
.sidebar-item.active-u { background: var(--sidebar-active-user); color: #fff; font-weight: 600; }
.sidebar-item.active-i { background: var(--sidebar-active-inst); color: #fff; font-weight: 600; }
.sidebar-item.active-a { background: var(--sidebar-active-admin); color: #fff; font-weight: 600; }
.sidebar-footer { padding: 8px 8px 12px; border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }

.dash-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--bg); }
.topbar { height: 58px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

/* Mobile bottom nav */
.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; font-size: 10px; font-weight: 600; color: var(--text-4); cursor: pointer; border: none; background: none; transition: color .12s; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
.bn-item.bna-u { color: var(--sidebar-active-user); }
.bn-item.bna-i { color: var(--sidebar-active-inst); }
.bn-item.bna-a { color: var(--sidebar-active-admin); }

/* ── MODAL ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); z-index: 999; display: flex; align-items: flex-end; justify-content: center; }
.modal-box { background: var(--surface); border-radius: var(--r-2xl) var(--r-2xl) 0 0; width: 100%; max-height: 92dvh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 16px); }
@media (min-width: 600px) {
  .modal-backdrop { align-items: center; padding: 20px; }
  .modal-box { border-radius: var(--r-2xl); max-width: 520px; max-height: 88dvh; }
}

/* ── TOAST ── */
.toast-wrap { position: fixed; bottom: 74px; right: 14px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(340px, calc(100vw - 28px)); }
.toast { background: var(--text); color: #fff; padding: 12px 14px; border-radius: var(--r-md); display: flex; gap: 10px; align-items: flex-start; pointer-events: auto; box-shadow: var(--shadow-xl); animation: toastIn .25s ease; }
@media (min-width: 768px) { .toast-wrap { bottom: 20px; right: 20px; } }

/* ── ROLE HUD ── */
.role-hud { position: fixed; bottom: 72px; left: 12px; z-index: 9998; }
.role-menu { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--border); padding: 6px; margin-bottom: 8px; box-shadow: var(--shadow-xl); min-width: 200px; }
.role-item { display: block; width: 100%; padding: 8px 12px; border-radius: var(--r); text-align: left; font-size: 13px; font-weight: 600; border: none; cursor: pointer; background: transparent; color: var(--text-2); font-family: var(--font-body); transition: background .1s; }
.role-item:hover { background: var(--surface-2); }
.role-item.ar { color: #fff; }
@media (min-width: 768px) { .role-hud { bottom: 20px; left: 16px; } }

/* ── ANIMATIONS ── */
@keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
@keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.anim { animation: fadeUp .28s ease; }
.floating { animation: float 5s ease-in-out infinite; }
.pulsing { animation: pulse 2s infinite; }

/* ── STAT CARD ── */
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.stat-icon { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-val { font-size: 22px; font-weight: 800; font-family: var(--font-heading); color: var(--text); line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* ── GRIDS (responsive) ── */
.grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 36px; align-items: center; }
.method-grid { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: center; }
.checkout-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.checkout-sidebar { display: none; }
.player-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.studio-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.verify-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.overview-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

@media (min-width: 560px) {
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 768px) {
  .sidebar { display: flex; }
  .bottom-nav { display: none; }
  .content { padding: 24px; }
  .checkout-grid { grid-template-columns: 1fr 320px; }
  .checkout-sidebar { display: block; }
  .verify-grid { grid-template-columns: 1fr 1fr; }
  .studio-grid { grid-template-columns: 1fr 1fr; }
  .player-grid { grid-template-columns: 1fr 280px; }
  .overview-grid { grid-template-columns: 2fr 1fr; }
}
@media (max-width: 767px) {
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .content { padding: 14px; padding-bottom: 76px; }
  .toast-wrap { bottom: 76px; }
  .role-hud { bottom: 76px; }
}
@media (min-width: 900px) {
  .hero-grid { grid-template-columns: 1fr 1fr; gap: 56px; }
  .method-grid { grid-template-columns: 1fr 1fr; gap: 48px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
}

/* ── LANDING ── */
.nav-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--brand-200); background: var(--brand-50); color: var(--brand-600); }
.gradient-text { background: linear-gradient(135deg, var(--brand-600) 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-image-wrap { border-radius: var(--r-2xl); overflow: hidden; box-shadow: var(--shadow-xl); border: 1px solid var(--border); position: relative; cursor: pointer; }
.hero-float { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-lg); }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-600); margin-bottom: 8px; font-family: var(--font-body); }
.glass-nav { background: rgba(255,255,255,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(228,228,231,.8); }
.nav-link { font-size: 14px; font-weight: 500; color: var(--text-3); transition: color .12s; font-family: var(--font-body); }
.nav-link:hover { color: var(--text); }
.pricing-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; transition: box-shadow .2s, transform .2s; }
.pricing-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.pricing-card.featured { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow-lg); transform: translateY(-4px); }
.testi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 22px; }
.prob-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; display: flex; gap: 14px; }
.icon-wrap { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feature-row { display: flex; gap: 14px; }
.feature-icon { width: 44px; height: 44px; border-radius: var(--r-md); background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,.12); }

/* ── VIDEO THUMB ── */
.vid-thumb { position: relative; aspect-ratio: 16/9; background: #0a0a0a; border-radius: var(--r-md); overflow: hidden; }
.vid-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.vid-thumb:hover img { transform: scale(1.04); }
.play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.play-circle { width: 40px; height: 40px; border-radius: 50%; background: rgba(26,86,219,.9); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(26,86,219,.5); transition: transform .15s; }
.vid-thumb:hover .play-circle { transform: scale(1.1); }
.lock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }

/* ── CURRICULUM ── */
.section-block { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.section-head { background: var(--sidebar); color: #fff; padding: 11px 14px; display: flex; align-items: center; gap: 10px; }
.lesson-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.lesson-row:last-child { border-bottom: none; }

/* ── ADMIN METHOD ROW ── */
.method-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.method-row:last-child { border-bottom: none; }

/* ── AVATAR ── */
.avatar { border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.avatar-ring-u { border: 2px solid var(--sidebar-active-user); }
.avatar-ring-i { border: 2px solid var(--sidebar-active-inst); }
.avatar-ring-a { border: 2px solid var(--sidebar-active-admin); }

/* ── MISC ── */
.text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; box-shadow: 0 0 0 2px rgba(34,197,94,.3); animation: pulse 2s infinite; }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--r); }
</style>
</head>

<div id="root"></div>
<script>
const {createElement:h, useState, useEffect, useRef} = React;

/* ── INLINE SVG ICONS (subset of Lucide paths) ── */
const ICON_PATHS = {
  MessageCircle:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  ArrowRight:"M5 12h14M12 5l7 7-7 7",
  ArrowLeft:"M19 12H5M12 19l-7-7 7-7",
  Play:"M5 3l14 9-14 9V3z",

function Icon({name, size=16, color, style: s}) {
  const d = ICON_PATHS[name];
  if (!d) return h('span', {style:{width:size,height:size,display:'inline-flex',flexShrink:0}});
  // Handle multi-path icons (separated by M after first)
  const paths = d.split(/(?=M(?!\s*[0-9.-]*\s*[LCQTAZlcqtaz]))/);
  return h('svg', {
    width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: color || 'currentColor', strokeWidth: 1.8,
    strokeLinecap: 'round', strokeLinejoin: 'round',
    style: {display:'inline-block',flexShrink:0,...(s||{})}
  }, d.split(';;;').map((pd,i) => h('path',{key:i,d:pd})));
}

/* ── useMobile ── */
function useMobile() {
  const [m, setM] = useState(window.innerWidth < 768);
  useEffect(() => {
    const fn = () => setM(window.innerWidth < 768);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return m;
}

/* ── TOAST ── */
let _tid = 0;
function useToast() {
  const [ts, setTs] = useState([]);
  const toast = (title, msg, type='info') => {
    const id = ++_tid;
    setTs(t => [...t, {id,title,msg,type}]);
    setTimeout(() => setTs(t => t.filter(x => x.id !== id)), 4200);
  };
  return { toasts: ts, toast, remove: id => setTs(t => t.filter(x => x.id !== id)) };
}

const ICON_MAP = { success:'CheckCircle', error:'XCircle', info:'Info', warning:'AlertTriangle' };
const COLOR_MAP = { success:'#22c55e', error:'#ef4444', info:'#60a5fa', warning:'#f59e0b' };

function ToastList({toasts, remove}) {
  return h('div', {className:'toast-wrap'},
    toasts.map(t => h('div', {key:t.id, className:'toast'},
      h(Icon, {name: ICON_MAP[t.type]||'Info', size:16, color: COLOR_MAP[t.type]||'#60a5fa'}),
      h('div', {style:{flex:1}},
        h('div', {style:{fontWeight:700,fontSize:13,color:'#fff'}}, t.title),
        h('div', {style:{fontSize:12,color:'rgba(255,255,255,.65)',marginTop:2,lineHeight:1.4}}, t.msg)
      ),
      h('button', {onClick:()=>remove(t.id), style:{color:'rgba(255,255,255,.4)',fontSize:16,padding:0,flexShrink:0}}, '×')
    ))
  );
}
